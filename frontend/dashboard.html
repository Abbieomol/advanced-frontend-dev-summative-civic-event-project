<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home · CivicEvents+</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/custom.css">
</head>
<body data-page="dashboard" class="flex min-h-screen flex-col bg-slate-50 text-slate-900">
  <div id="site-header"></div>

  <main id="main" class="mx-auto w-full max-w-6xl flex-1 px-4 py-8" tabindex="-1">
    <section class="relative overflow-hidden rounded-2xl bg-gradient-to-r from-brand-800 to-brand-600 p-6 text-white sm:p-8">
      <div class="absolute inset-x-0 bottom-0 nairobi-stripe" aria-hidden="true"></div>
      <h1 id="greeting" class="text-2xl font-bold sm:text-3xl">Welcome</h1>
      <p class="mt-2 max-w-xl text-brand-50">Here's what's happening in your city.</p>
      <div class="mt-5 flex flex-wrap gap-3">
        <a href="events.html" class="btn btn-accent">Browse events</a>
        <!-- ROLE GUARD: admins only -->
        <a href="admin-dashboard.html" class="btn border-white text-white hover:bg-brand-700" data-role="admin" hidden>Open admin dashboard</a>
      </div>
    </section>

    <section aria-labelledby="stats-heading" class="mt-8">
      <h2 id="stats-heading" class="sr-only">Your activity</h2>
      <div id="stats" class="grid grid-cols-2 gap-4 lg:grid-cols-4" aria-busy="true"></div>
    </section>

    <section aria-labelledby="upcoming-heading" class="mt-10">
      <div class="flex items-end justify-between">
        <h2 id="upcoming-heading" class="text-xl font-semibold">Coming up next</h2>
        <a href="events.html" class="text-sm font-semibold text-brand-800 underline">See all events</a>
      </div>
      <div id="upcoming" class="mt-4 grid gap-6 sm:grid-cols-2 lg:grid-cols-3" aria-busy="true"></div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/events-shared.js"></script>
  <script src="js/pages/dashboard.js"></script>
</body>
</html>
