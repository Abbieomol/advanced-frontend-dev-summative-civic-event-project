<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Announcement form · CivicEvents+</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/custom.css">
</head>
<body data-page="announcement-form" class="flex min-h-screen flex-col bg-slate-50 text-slate-900">
  <div id="site-header"></div>

  <main id="main" class="mx-auto w-full max-w-6xl flex-1 px-4 py-8 lg:grid lg:grid-cols-[13rem_1fr] lg:gap-8" tabindex="-1">
    <div id="admin-nav"></div>

    <div class="max-w-3xl">
      <nav aria-label="Breadcrumb" class="text-sm"><a href="announcements.html" class="font-semibold text-brand-800 underline">‹ All announcements</a></nav>
      <h1 id="form-title" class="mt-2 text-3xl font-bold">New announcement</h1>

      <form id="announcement-form" class="mt-6 space-y-5 rounded-xl border border-slate-200 bg-white p-6" novalidate>
        <div class="form-alert hidden rounded-lg border border-red-300 bg-red-50 p-3 text-sm text-red-900" role="alert"></div>

        <div class="field">
          <label for="title" class="label">Title <span aria-hidden="true">*</span></label>
          <input id="title" type="text" required maxlength="200" class="input">
        </div>

        <div class="field" id="audio-field">
          <label for="audio" class="label">Audio file <span aria-hidden="true">*</span></label>
          <p id="audio-hint" class="mb-2 text-sm text-slate-600">MP3, WAV, M4A or OGG, up to 5 MB.</p>
          <input id="audio" type="file" accept=".mp3,.wav,.m4a,.ogg,audio/*" aria-describedby="audio-hint"
            class="block w-full text-sm file:mr-3 file:rounded-lg file:border-0 file:bg-brand-700 file:px-4 file:py-2 file:font-semibold file:text-white hover:file:bg-brand-800">
          <div id="audio-preview" class="mt-3 hidden">
            <p class="text-sm font-semibold text-slate-700" id="preview-label">Preview</p>
            <audio controls preload="metadata" class="mt-1 w-full" aria-labelledby="preview-label"></audio>
          </div>
        </div>

        <div class="flex items-center gap-3">
          <input id="published" type="checkbox" checked class="h-4 w-4 accent-brand-700">
          <label for="published" class="font-semibold">Published</label>
        </div>

        <div id="upload-progress" class="hidden" role="progressbar" aria-label="Upload progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="flex justify-between text-sm"><span>Uploading…</span><span class="pct">0%</span></div>
          <div class="mt-1 h-2 rounded bg-slate-200"><div class="bar h-2 rounded bg-brand-600" style="width:0%"></div></div>
        </div>

        <div class="flex flex-wrap gap-3">
          <button type="submit" class="btn btn-primary">Create announcement</button>
          <a href="announcements.html" class="btn btn-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/announcement-form.js"></script>
</body>
</html>
