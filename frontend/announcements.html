<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Announcements · CivicEvents+</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/custom.css">
</head>
<body data-page="announcements" class="flex min-h-screen flex-col bg-slate-50 text-slate-900">
  <div id="site-header"></div>

  <main id="main" class="mx-auto w-full max-w-6xl flex-1 px-4 py-8" tabindex="-1">
    <div class="flex flex-wrap items-end justify-between gap-4">
      <div>
        <h1 class="text-3xl font-bold">Announcements</h1>
        <p class="mt-1 text-slate-600">Short audio updates from the city. Press play to listen here, or open one for the full player.</p>
      </div>
      <!-- ROLE GUARD: admins only -->
      <a href="announcement-form.html" class="btn btn-primary" data-role="admin" hidden>+ New announcement</a>
    </div>

    <p id="results-count" class="mt-6 text-sm text-slate-600" aria-live="polite"></p>
    <div id="list" class="mt-3 grid gap-4 md:grid-cols-2" aria-busy="true"></div>
  </main>

  <div id="site-footer"></div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/content-admin.js"></script>
  <script src="js/pages/announcements.js"></script>
</body>
</html>
