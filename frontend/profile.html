<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My profile · CivicEvents+</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/custom.css">
</head>
<body data-page="profile" class="flex min-h-screen flex-col bg-slate-50 text-slate-900">
  <div id="site-header"></div>

  <main id="main" class="mx-auto w-full max-w-3xl flex-1 px-4 py-8" tabindex="-1">
    <h1 class="text-3xl font-bold">My profile</h1>
    <p class="mt-1 text-slate-600">Your account details. You can change your name and email.</p>

    <section id="profile-summary" class="mt-6 rounded-xl border border-slate-200 bg-white p-6" aria-labelledby="summary-heading" aria-busy="true">
      <h2 id="summary-heading" class="sr-only">Account summary</h2>
      <div class="flex items-center gap-4" aria-hidden="true">
        <div class="skeleton h-16 w-16 rounded-full"></div>
        <div class="flex-1 space-y-2"><div class="skeleton h-5 w-1/2 rounded"></div><div class="skeleton h-4 w-1/3 rounded"></div></div>
      </div>
    </section>

    <section class="mt-6 rounded-xl border border-slate-200 bg-white p-6" aria-labelledby="edit-heading">
      <h2 id="edit-heading" class="text-lg font-semibold">Edit details</h2>
      <form id="profile-form" class="mt-4 space-y-5" novalidate>
        <div class="form-alert hidden rounded-lg border border-red-300 bg-red-50 p-3 text-sm text-red-900" role="alert"></div>

        <div class="field">
          <label for="full_name" class="label">Full name</label>
          <input id="full_name" name="full_name" type="text" autocomplete="name" required class="input" disabled>
        </div>

        <div class="field">
          <label for="email" class="label">Email address</label>
          <input id="email" name="email" type="email" autocomplete="email" required class="input" disabled>
        </div>

        <div class="flex flex-wrap gap-3">
          <button type="submit" class="btn btn-primary" disabled>Save changes</button>
          <button type="reset" class="btn btn-secondary" disabled>Undo changes</button>
        </div>
      </form>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/profile.js"></script>
</body>
</html>
