<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Events · CivicEvents+</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/custom.css">
</head>
<body data-page="events" class="flex min-h-screen flex-col bg-slate-50 text-slate-900">
  <div id="site-header"></div>

  <main id="main" class="mx-auto w-full max-w-6xl flex-1 px-4 py-8" tabindex="-1">
    <div class="flex flex-wrap items-end justify-between gap-4">
      <div>
        <h1 class="text-3xl font-bold">Events</h1>
        <p class="mt-1 text-slate-600">Find something happening in your city and save your place.</p>
      </div>
      <!-- ROLE GUARD (UI): only admins see the create button. event-form.html is built on Saturday. -->
      <a href="event-form.html" class="btn btn-primary" data-role="admin" hidden>+ New event</a>
    </div>

    <!-- Filters -->
    <form id="filters" class="mt-6 grid gap-4 rounded-xl border border-slate-200 bg-white p-4 sm:grid-cols-2 lg:grid-cols-5" role="search" aria-label="Filter events">
      <div class="lg:col-span-2">
        <label for="filter-q" class="label">Search</label>
        <input id="filter-q" type="search" class="input" placeholder="Title, description or place">
      </div>
      <div>
        <label for="filter-location" class="label">Location</label>
        <select id="filter-location" class="input"><option value="">All locations</option></select>
      </div>
      <div>
        <label for="filter-from" class="label">From</label>
        <input id="filter-from" type="date" class="input">
      </div>
      <div>
        <label for="filter-to" class="label">To</label>
        <input id="filter-to" type="date" class="input">
      </div>
      <div class="flex flex-wrap items-center gap-x-6 gap-y-2 sm:col-span-2 lg:col-span-5">
        <label class="flex items-center gap-2 text-sm"><input id="filter-past" type="checkbox" class="h-4 w-4 accent-teal-700"> Include past events</label>
        <!-- ROLE GUARD (UI): unpublished events are only listed for admins -->
        <label class="flex items-center gap-2 text-sm" data-role="admin" hidden><input id="filter-unpublished" type="checkbox" class="h-4 w-4 accent-teal-700"> Include unpublished</label>
        <button type="reset" class="ml-auto text-sm font-semibold text-teal-800 underline">Clear filters</button>
      </div>
    </form>

    <p id="results-count" class="mt-6 text-sm text-slate-600" aria-live="polite"></p>
    <div id="events-grid" class="mt-3 grid gap-6 sm:grid-cols-2 lg:grid-cols-3" aria-busy="true"></div>
    <nav id="pagination" class="mt-8 flex flex-wrap items-center justify-center gap-2" aria-label="Events pages"></nav>
  </main>

  <div id="site-footer"></div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/events-shared.js"></script>
  <script src="js/pages/events.js"></script>
</body>
</html>
