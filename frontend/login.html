<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in · CivicEvents+</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/custom.css">
</head>
<body class="min-h-screen bg-slate-50 text-slate-900">
  <main id="main" class="grid min-h-screen lg:grid-cols-2">
    <section class="relative hidden flex-col justify-between bg-ink p-12 text-white lg:flex" aria-hidden="true">
      <div class="absolute inset-x-0 top-0 nairobi-stripe"></div>
      <p class="text-xl font-bold text-sun-400">CivicEvents+</p>
      <div>
        <p class="text-4xl font-bold leading-tight">Your city, <span class="text-sun-400">in one place.</span></p>
        <p class="mt-4 max-w-md text-neutral-300">Find community events, listen to announcements and watch city updates, all accessible on any device.</p>
      </div>
      <p class="text-sm text-brand-300">Accessible City Events &amp; Services Portal</p>
    </section>

    <section class="flex items-center justify-center p-6">
      <div class="w-full max-w-md">
        <h1 class="text-3xl font-bold">Sign in</h1>
        <p class="mt-2 text-slate-600">New here? <a href="signup.html" class="font-semibold text-brand-800 underline">Create an account</a></p>

        <div id="login-notice" class="mt-6 hidden rounded-lg border p-3 text-sm" role="status"></div>

        <form id="login-form" class="mt-6 space-y-5" novalidate>
          <div class="form-alert hidden rounded-lg border border-red-300 bg-red-50 p-3 text-sm text-red-900" role="alert"></div>

          <div class="field">
            <label for="email" class="label">Email address</label>
            <input id="email" name="email" type="email" autocomplete="email" required class="input">
          </div>

          <div class="field">
            <label for="password" class="label">Password</label>
            <div class="relative">
              <input id="password" name="password" type="password" autocomplete="current-password" required class="input pr-20">
              <button type="button" class="toggle-password absolute inset-y-0 right-0 px-3 text-sm font-semibold text-brand-800" aria-controls="password" aria-pressed="false">Show</button>
            </div>
          </div>

          <div class="flex items-center gap-2">
            <input id="remember" name="remember" type="checkbox" class="h-4 w-4 accent-brand-700">
            <label for="remember" class="text-sm text-slate-700">Keep me signed in on this device</label>
          </div>

          <button type="submit" class="btn btn-primary w-full">Sign in</button>
        </form>
      </div>
    </section>
  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/api.js"></script>
  <script src="js/pages/login.js"></script>
</body>
</html>
