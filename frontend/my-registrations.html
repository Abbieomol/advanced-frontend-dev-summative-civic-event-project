<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My registrations · CivicEvents+</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/custom.css">
</head>
<body data-page="my-registrations" class="flex min-h-screen flex-col bg-slate-50 text-slate-900">
  <div id="site-header"></div>

  <main id="main" class="mx-auto w-full max-w-4xl flex-1 px-4 py-8" tabindex="-1">
    <h1 class="text-3xl font-bold">My registrations</h1>
    <p class="mt-1 text-slate-600">Events you've signed up for.</p>

    <!-- Tabs: Upcoming / Past / Cancelled -->
    <div class="mt-6 flex gap-2 border-b border-slate-200" role="tablist" aria-label="Registration status">
      <button type="button" role="tab" id="tab-upcoming" aria-controls="reg-list" aria-selected="true" data-tab="upcoming" class="tab -mb-px border-b-2 px-4 py-2 text-sm font-semibold">Upcoming <span class="count"></span></button>
      <button type="button" role="tab" id="tab-past" aria-controls="reg-list" aria-selected="false" data-tab="past" class="tab -mb-px border-b-2 px-4 py-2 text-sm font-semibold" tabindex="-1">Past <span class="count"></span></button>
      <button type="button" role="tab" id="tab-cancelled" aria-controls="reg-list" aria-selected="false" data-tab="cancelled" class="tab -mb-px border-b-2 px-4 py-2 text-sm font-semibold" tabindex="-1">Cancelled <span class="count"></span></button>
    </div>

    <div id="reg-list" role="tabpanel" aria-labelledby="tab-upcoming" class="mt-6 space-y-3" aria-busy="true"></div>
  </main>

  <div id="site-footer"></div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/events-shared.js"></script>
  <script src="js/pages/my-registrations.js"></script>
</body>
</html>
