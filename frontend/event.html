<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event · CivicEvents+</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/custom.css">
</head>
<body data-page="events" class="flex min-h-screen flex-col bg-slate-50 text-slate-900">
  <div id="site-header"></div>

  <main id="main" class="mx-auto w-full max-w-5xl flex-1 px-4 py-8" tabindex="-1">
    <nav aria-label="Breadcrumb" class="text-sm">
      <a href="events.html" class="font-semibold text-brand-800 underline">‹ All events</a>
    </nav>

    <!-- Filled in by js/pages/event.js -->
    <div id="event-detail" class="mt-4" aria-busy="true">
      <div class="skeleton h-64 rounded-2xl" aria-hidden="true"></div>
      <div class="mt-6 space-y-3" aria-hidden="true">
        <div class="skeleton h-8 w-2/3 rounded"></div>
        <div class="skeleton h-4 w-1/3 rounded"></div>
        <div class="skeleton h-24 w-full rounded"></div>
      </div>
    </div>

    <!-- ROLE GUARD (UI): the attendees list is admin-only (GET .../attendees is admin-only too) -->
    <section id="attendees" data-role="admin" hidden class="mt-10" aria-labelledby="attendees-heading">
      <h2 id="attendees-heading" class="text-xl font-semibold">Registered attendees</h2>
      <div id="attendees-body" class="mt-3"></div>
    </section>

    <!-- Feedback: admins see every review and the average; users see and manage their own -->
    <section id="feedback" hidden class="mt-10" aria-labelledby="feedback-heading">
      <h2 id="feedback-heading" class="text-xl font-semibold">Feedback</h2>
      <div id="feedback-body" class="mt-3"></div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/events-shared.js"></script>
  <script src="js/feedback.js"></script>
  <script src="js/pages/event.js"></script>
</body>
</html>
