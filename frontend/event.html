<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event · CivicEvents+</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/custom.css">
</head>
<body data-page="events" class="flex min-h-screen flex-col bg-slate-50 text-slate-900">
  <div id="site-header"></div>

  <main id="main" class="mx-auto w-full max-w-5xl flex-1 px-4 py-8" tabindex="-1">
    <nav aria-label="Breadcrumb" class="text-sm">
      <a href="events.html" class="font-semibold text-teal-800 underline">‹ All events</a>
    </nav>

    <!-- Filled in by js/pages/event.js -->
    <div id="event-detail" class="mt-4" aria-busy="true">
      <div class="skeleton h-64 rounded-2xl" aria-hidden="true"></div>
      <div class="mt-6 space-y-3" aria-hidden="true">
        <div class="skeleton h-8 w-2/3 rounded"></div>
        <div class="skeleton h-4 w-1/3 rounded"></div>
        <div class="skeleton h-24 w-full rounded"></div>
      </div>
    </div>

    <!--
      Saturday: add the feedback section (average rating, list, form) and the
      admin-only attendees list (data-role="admin") below this line.
    -->
  </main>

  <div id="site-footer"></div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/events-shared.js"></script>
  <script src="js/pages/event.js"></script>
</body>
</html>
