<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage users · CivicEvents+</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/custom.css">
</head>
<body data-page="admin-users" class="flex min-h-screen flex-col bg-slate-50 text-slate-900">
  <div id="site-header"></div>

  <main id="main" class="mx-auto w-full max-w-6xl flex-1 px-4 py-8 lg:grid lg:grid-cols-[13rem_1fr] lg:gap-8" tabindex="-1">
    <div id="admin-nav"></div>

    <div class="min-w-0">
      <h1 class="text-3xl font-bold">Users</h1>
      <p class="mt-1 text-slate-600">Enable or disable accounts. Roles can't be changed here.</p>

      <form id="filters" class="mt-6 grid gap-4 rounded-xl border border-slate-200 bg-white p-4 sm:grid-cols-3" role="search" aria-label="Filter users">
        <div><label for="q" class="label">Search</label><input id="q" type="search" class="input" placeholder="Name or email"></div>
        <div><label for="role" class="label">Role</label>
          <select id="role" class="input"><option value="">All roles</option><option value="user">User</option><option value="admin">Admin</option></select></div>
        <div><label for="status" class="label">Status</label>
          <select id="status" class="input"><option value="">Any status</option><option value="active">Active</option><option value="disabled">Disabled</option></select></div>
      </form>

      <p id="results-count" class="mt-6 text-sm text-slate-600" aria-live="polite"></p>
      <div id="users" class="mt-3" aria-busy="true"></div>
    </div>
  </main>

  <!-- User details dialog -->
  <div id="user-dialog" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/50 p-4">
    <div role="dialog" aria-modal="true" aria-labelledby="user-dialog-title" class="w-full max-w-md rounded-xl bg-white p-6 shadow-xl">
      <div class="flex items-start justify-between gap-4">
        <h2 id="user-dialog-title" class="text-lg font-semibold">User details</h2>
        <button type="button" class="dialog-close text-2xl leading-none text-slate-500 hover:text-slate-900" aria-label="Close">&times;</button>
      </div>
      <div id="user-dialog-body" class="mt-4"></div>
    </div>
  </div>

  <div id="site-footer"></div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/admin-users.js"></script>
</body>
</html>
